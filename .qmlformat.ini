; Formatting rules for qmlformat (Qt 6). Two-space indent, matching .prettierrc
; and .stylua.toml so every language in the repo lines up the same way.
;
; Only the Qt 6 qmlformat reads this file; the qmlformat on $PATH may be the
; Qt 5 one, which has no settings at all. format.sh picks the right binary.
[General]
IndentWidth=2
UseTabs=false
MaxColumnWidth=-1
NewlineType=unix
SemicolonRule=always
SingleLineEmptyObjects=false

; Left off on purpose: these reorder properties and imports, which would rewrite
; every file's structure rather than just its whitespace.
NormalizeOrder=false
GroupAttributesTogether=false
SortImports=false
ObjectsSpacing=false
FunctionsSpacing=false
