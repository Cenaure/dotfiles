# base.conf is the hand-tuned palette: the full 16 ANSI colours, tabs and
# borders. colors.conf is generated per theme by
# quickshell/scripts/themes/change-kitty-colors.bash and overrides only the
# handful of roles a theme actually defines, so it must come second.
include colors/base.conf
include colors/colors.conf

font_family 		JetBrainsMono Nerd Font Mono
font_size 		13

disable_ligatures no
enable_audio_bell no

shell fish
shell_integration disabled

cursor_shape beam

url_style curly

remember_window_size no
window_padding_width 18

background_opacity 0.8
scrollbar_track_opacity 0
scrollbar_handle_opacity 0
scrollbar_track_hover_opacity 0
confirm_as_window_close 0

sync_to_monitor no

repaint_delay 8
input_delay 3
cursor_trail 3
